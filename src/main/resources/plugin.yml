name: WorldDelete
version: 1.0.0
description: Delete worlds with a single command
main: com.worlddelete.WorldDeletePlugin
api-version: 1.21

commands:
  deleteworld:
    description: Delete a world and remove it from Multiverse config
    usage: /deleteworld <worldname>
    permission: worlddelete.delete
    aliases:
      - dw

permissions:
  worlddelete.delete:
    description: Allows players to delete worlds
    default: op
